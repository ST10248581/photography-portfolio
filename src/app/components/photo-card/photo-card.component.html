<div class="photo-card" [class]="'ratio-' + photo.aspectRatio" (click)="onClick()">
  @if (photo.imagePath) {
    <div class="photo-image" [class]="'ratio-' + photo.aspectRatio">
      <img [src]="photo.imagePath" [alt]="photo.title" loading="lazy">
    </div>
  } @else {
    <div class="photo-placeholder" [style.background-color]="photo.placeholder.bgColor">
      <span class="placeholder-label">{{ photo.placeholder.label }}</span>
    </div>
  }
  @if (showMeta) {
    <div class="photo-meta">
      <span class="photo-title">{{ photo.title }}</span>
      <span class="photo-location">{{ photo.location }} · {{ photo.date }}</span>
    </div>
  }
</div>
