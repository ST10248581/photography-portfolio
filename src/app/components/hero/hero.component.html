<section class="hero">
  <div class="hero-bg">
    @if (config.imagePath) {
      <img [src]="config.imagePath" alt="Hero background" class="hero-image">
    }
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-kicker">{{ config.kicker }}</p>
    <h1 class="hero-title">{{ config.title }}</h1>
    <div class="hero-divider"></div>
    <p class="hero-subtitle">{{ config.subtitle }}</p>
    <a routerLink="/work" class="hero-cta">
      Explore Work
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
  <button class="hero-edit-btn" (click)="onEditClick($event)" aria-label="Edit hero">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
  </button>
  <div class="scroll-hint">
    <svg width="16" height="24" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1" y="1" width="14" height="22" rx="7"/>
      <line x1="8" y1="6" x2="8" y2="10"/>
    </svg>
  </div>
</section>
