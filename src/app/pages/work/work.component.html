<section class="work-page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Work</h1>
      <p class="page-subtitle">Wildlife, nature, and exploration — organised by collection.</p>
    </div>

    <div class="collections-grid">
      @for (collection of collections; track collection.id; let i = $index) {
        <div class="collection-item" [style.animation-delay]="(i * 100) + 'ms'">
          <app-collection-card [collection]="collection"></app-collection-card>
        </div>
      }
    </div>
  </div>
</section>
